<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EDF5">
<title>Set Password - CIPHER</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ground:#E8EDF5;--text1:#0E1320;--text2:#4B5569;--text3:#6E788C;--border:rgba(14,19,32,.10);--accent:#255EF0;--accent-deep:#1F4FD1;--red:#C8352A;--green:#1C8A4E;--ease-out:cubic-bezier(0.23,1,0.32,1);color-scheme:light}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-tap-highlight-color:rgba(47,107,255,.12);touch-action:manipulation}
  body{background:var(--ground);color:var(--text1);font-family:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 1600' preserveAspectRatio='none'><path d='M0 250 C220 150 520 360 800 210 L800 430 C540 540 260 330 0 470 Z' fill='%232F6BFF' fill-opacity='.12'/><path d='M0 1050 C300 950 520 1130 800 1010 L800 1190 C520 1300 260 1110 0 1240 Z' fill='%238FB0FF' fill-opacity='.18'/><path d='M0 560 C260 470 560 650 800 520' stroke='white' stroke-opacity='.75' stroke-width='2' fill='none'/></svg>") center/100% 100% no-repeat,var(--ground)}
  ::selection{background:var(--accent);color:#fff}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
  .card{width:100%;max-width:400px;padding:34px 28px 28px;border-radius:30px;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 0 0 1px rgba(255,255,255,.6),0 24px 50px -24px rgba(24,40,90,.35)}
  .logo{text-align:center;margin-bottom:26px}
  .logo-mark{font-size:22px;font-weight:800;letter-spacing:.16em;color:var(--text1)}
  .logo-sub{font-size:13.5px;color:var(--text2);margin-top:6px}
  h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
  .sub{font-size:14px;color:var(--text2);line-height:1.5;margin:-8px 0 20px}
  .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  label{font-size:13px;font-weight:600;color:var(--text2)}
  input{background:#fff;border:1px solid var(--border);border-radius:14px;color:var(--text1);padding:13px 14px;font-family:inherit;font-size:16px;width:100%;outline:none;transition:border-color .15s ease,box-shadow .15s ease}
  input::placeholder{color:var(--text3)}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(47,107,255,.14)}
  .btn{width:100%;padding:15px;border-radius:999px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 24px -12px rgba(37,94,240,.65);transition:transform .16s var(--ease-out),background-color .15s ease}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  @media (hover:hover) and (pointer:fine){.btn:not(:disabled):hover{background:var(--accent-deep)}}
  .error{background:rgba(217,58,43,.08);border:1px solid rgba(217,58,43,.25);color:var(--red);padding:11px 14px;border-radius:14px;font-size:13.5px;margin-bottom:14px;display:none;line-height:1.5}
  .success{background:rgba(31,157,87,.09);border:1px solid rgba(31,157,87,.28);color:var(--green);padding:11px 14px;border-radius:14px;font-size:13.5px;margin-bottom:14px;display:none;line-height:1.5}
  .hint{text-align:center;font-size:13px;color:var(--text2);margin-top:16px}
  .hint a{color:var(--text2);text-underline-offset:.2em}
  @media (prefers-reduced-transparency:reduce){.card{background:#F7F9FD;-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo"><div class="logo-mark">CIPHER</div></div>
  <h2>Set your password</h2>
  <div class="error" id="err"></div>
  <div class="success" id="ok"></div>
  <div id="form">
    <div class="form-group">
      <label>New password</label>
      <input type="password" id="pass" placeholder="At least 8 characters" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>Confirm password</label>
      <input type="password" id="pass2" placeholder="Re-enter password" autocomplete="new-password">
    </div>
    <button class="btn" id="btn" onclick="doSubmit()">Set password</button>
  </div>
</div>
<script src="js/api.js?v=2"></script>
<script>
  const params = new URLSearchParams(location.search)
  const token = params.get('token')
  const err = document.getElementById('err')
  const ok  = document.getElementById('ok')

  if (!token) {
    document.getElementById('form').style.display = 'none'
    err.textContent = 'This link is missing a token. Use the link from your email, or request a new one from the login page.'
    err.style.display = ''
  }

  document.getElementById('pass2').addEventListener('keydown', e => { if (e.key === 'Enter') doSubmit() })

  async function doSubmit() {
    const pass  = document.getElementById('pass').value
    const pass2 = document.getElementById('pass2').value
    const btn   = document.getElementById('btn')
    err.style.display = 'none'

    if (pass.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = ''; return }
    if (pass !== pass2)  { err.textContent = "Passwords don't match."; err.style.display = ''; return }

    btn.disabled = true; btn.textContent = 'Saving...'
    try {
      await API.setPassword(token, pass)
      document.getElementById('form').style.display = 'none'
      ok.textContent = 'Password set. Redirecting to sign in...'
      ok.style.display = ''
      setTimeout(() => location.href = 'login.html', 1500)
    } catch (e) {
      err.textContent = e.message || 'Something went wrong.'
      err.style.display = ''
      btn.disabled = false; btn.textContent = 'Set password'
    }
  }
</script>
</body>
</html>
